name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet publish PortfolioSite.Web -c Release -o publish
      - name: Set the base href to the repository name
        run: sed -i 's|<base href="/" />|<base href="/PortfolioSite/" />|' publish/wwwroot/index.html
      - name: Let GitHub Pages open every page address
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published page answers 200 with the right base href
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors -o index.html https://bj0594.github.io/PortfolioSite/
          grep -q '<base href="/PortfolioSite/" />' index.html
